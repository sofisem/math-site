<!DOCTYPE html>
<html lang="ru">
<head>
    <script>
        if (!localStorage.getItem('sonches_user_role')) {
            window.location.href = 'login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonches Math | Тренажер формул: Векторы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .flashcards-wrapper {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        .fc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .fc-progress {
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--color-heading);
            font-size: 18px;
        }

        .fc-progress span {
            color: var(--color-pink);
        }

        .fc-btn-back {
            display: inline-block;
            background: var(--color-blue-light);
            color: var(--color-heading);
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: 0.3s;
        }
        .fc-btn-back:hover {
            background: var(--color-blue);
            color: #fff;
        }

        /* Сцена с карточкой */
        .card-scene {
            perspective: 1500px;
            width: 100%;
            height: 380px;
            position: relative;
            margin-bottom: 30px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: var(--radius-large);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard.swipe-right {
            animation: swipeRight 0.5s forwards;
        }
        .flashcard.swipe-left {
            animation: swipeLeft 0.5s forwards;
        }

        @keyframes swipeRight {
            to { transform: translateX(150%) rotate(20deg); opacity: 0; }
        }
        @keyframes swipeLeft {
            to { transform: translateX(-150%) rotate(-20deg); opacity: 0; }
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: var(--radius-large);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            box-shadow: var(--shadow);
            border: 3px solid var(--color-blue-light);
            text-align: center;
        }

        .card-front {
            background: #fff;
        }

        .card-back {
            background: linear-gradient(135deg, #f9fbfd 0%, #e6f0ff 100%);
            transform: rotateY(180deg);
            border-color: var(--color-blue);
        }

        .card-label {
            font-family: var(--font-heading);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #b0c4de;
            margin-bottom: 20px;
        }

        .card-question {
            font-family: var(--font-heading);
            font-size: 26px;
            font-weight: 700;
            color: var(--color-heading);
            line-height: 1.3;
        }

        .card-answer {
            font-size: 22px;
            color: var(--color-text);
            line-height: 1.5;
            font-weight: 600;
            overflow-x: auto;
            max-width: 100%;
        }

        .card-hint {
            position: absolute;
            bottom: 20px;
            font-size: 13px;
            color: #b0c4de;
            font-weight: 600;
        }

        /* Кнопки действий */
        .fc-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .fc-btn {
            padding: 20px 15px;
            border: none;
            border-radius: var(--radius-small);
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .fc-btn-again {
            background: var(--color-pink-light);
            color: var(--color-pink);
            border: 2px solid var(--color-pink);
        }
        .fc-btn-again:hover {
            background: var(--color-pink);
            color: #fff;
        }

        .fc-btn-known {
            background: var(--color-blue-light);
            color: var(--color-heading);
            border: 2px solid var(--color-blue);
        }
        .fc-btn-known:hover {
            background: var(--color-blue);
            color: #fff;
        }

        /* Экран завершения */
        .finish-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
            background: #fff;
            border-radius: var(--radius-large);
            box-shadow: var(--shadow);
            border: 2px solid var(--color-blue-light);
        }
        .finish-screen.active {
            display: block;
        }
        .finish-emoji {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .finish-title {
            font-family: var(--font-heading);
            font-size: 28px;
            color: var(--color-heading);
            margin-bottom: 15px;
        }
        .finish-text {
            font-size: 16px;
            color: #777;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .finish-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .finish-btn {
            padding: 14px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 15px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }
        .finish-btn-primary {
            background: var(--color-blue);
            color: #fff;
        }
        .finish-btn-primary:hover {
            background: #4a8cdb;
        }
        .finish-btn-secondary {
            background: var(--color-blue-light);
            color: var(--color-heading);
        }
        .finish-btn-secondary:hover {
            background: var(--color-pink-light);
            color: var(--color-pink);
        }

        @media (max-width: 600px) {
            .card-scene { height: 340px; }
            .card-question { font-size: 20px; }
            .card-answer { font-size: 18px; }
            .card-face { padding: 30px 20px; }
            .fc-actions { grid-template-columns: 1fr; }
            .fc-btn { padding: 16px; }
        }
    </style>
</head>
<body>

    <div class="bg-blob bg-blob--blue"></div>
    <div class="bg-blob bg-blob--pink"></div>

    <div class="app-wrapper" style="display: block; padding: 30px 15px; overflow-y: auto; height: 100vh;">
        <div class="flashcards-wrapper">

            <!-- Заголовок и прогресс -->
            <div class="fc-header" id="fc-header">
                <a href="task2.html" class="fc-btn-back">← К заданию 2</a>
                <div class="fc-progress">
                    Осталось: <span id="fc-remaining">0</span> / <span id="fc-total">0</span>
                </div>
            </div>

            <!-- Сцена с карточкой -->
            <div id="fc-scene-container">
                <div class="card-scene">
                    <div class="flashcard" id="flashcard" onclick="flipCard()">
                        <div class="card-face card-front">
                            <div class="card-label">Вопрос</div>
                            <div class="card-question" id="card-question"></div>
                            <div class="card-hint">Нажми, чтобы увидеть ответ</div>
                        </div>
                        <div class="card-face card-back">
                            <div class="card-label">Ответ</div>
                            <div class="card-answer" id="card-answer"></div>
                            <div class="card-hint">Ты помнил? Выбери ниже</div>
                        </div>
                    </div>
                </div>

                <!-- Кнопки действий -->
                <div class="fc-actions" id="fc-actions">
                    <button class="fc-btn fc-btn-again" onclick="markCard(false)">🔁 Не помню</button>
                    <button class="fc-btn fc-btn-known" onclick="markCard(true)">✅ Помню</button>
                </div>
            </div>

            <!-- Экран завершения -->
            <div class="finish-screen" id="finish-screen">
                <div class="finish-emoji">🎉</div>
                <h2 class="finish-title">Отлично! Все карточки пройдены</h2>
                <p class="finish-text" id="finish-text">
                    Ты вспомнил все формулы. Так держать!
                </p>
                <div class="finish-actions">
                    <button class="finish-btn finish-btn-primary" onclick="restartDeck()">🔄 Начать заново</button>
                    <a href="task2.html" class="finish-btn finish-btn-secondary">К заданию 2</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ==== ДАННЫЕ КАРТОЧЕК (только для Задания 2: Векторы) ====
        const FLASHCARDS = [
            // --- Блок 1: Координаты и длина вектора ---
            { 
                question: "Как найти координаты вектора \\(\\vec{AB}\\) по координатам точек \\(A(x_a; y_a)\\) и \\(B(x_b; y_b)\\)?", 
                answer: "\\(\\vec{AB} = \\{x_b - x_a;\\; y_b - y_a\\}\\) (из конца вычесть начало)" 
            },
            { 
                question: "Как найти длину вектора \\(\\vec{a}\\{x; y\\}\\)?", 
                answer: "\\(|\\vec{a}| = \\sqrt{x^2 + y^2}\\)" 
            },

            // --- Блок 2: Действия с векторами ---
            { 
                question: "Сложение векторов \\(\\vec{a}\\{x_a; y_a\\}\\) и \\(\\vec{b}\\{x_b; y_b\\}\\)", 
                answer: "\\(\\vec{a} + \\vec{b} = \\{x_a + x_b;\\; y_a + y_b\\}\\)" 
            },
            { 
                question: "Вычитание векторов \\(\\vec{a}\\{x_a; y_a\\}\\) и \\(\\vec{b}\\{x_b; y_b\\}\\)", 
                answer: "\\(\\vec{a} - \\vec{b} = \\{x_a - x_b;\\; y_a - y_b\\}\\)" 
            },
            { 
                question: "Умножение вектора \\(\\vec{a}\\{x_a; y_a\\}\\) на число \\(k\\)", 
                answer: "\\(k \\cdot \\vec{a} = \\{k \\cdot x_a;\\; k \\cdot y_a\\}\\)" 
            },

            // --- Блок 3: Скалярное произведение ---
            { 
                question: "Скалярное произведение через координаты", 
                answer: "\\(\\vec{a} \\cdot \\vec{b} = x_a \\cdot x_b + y_a \\cdot y_b\\)" 
            },
            { 
                question: "Скалярное произведение через длины и угол", 
                answer: "\\(\\vec{a} \\cdot \\vec{b} = |\\vec{a}| \\cdot |\\vec{b}| \\cdot \\cos \\alpha\\)" 
            },
          

            // --- Блок 4: Угол между векторами ---
            { 
                question: "Как найти косинус угла между векторами \\(\\vec{a}\\) и \\(\\vec{b}\\)?", 
                answer: "\\(\\cos \\alpha = \\dfrac{\\vec{a} \\cdot \\vec{b}}{|\\vec{a}| \\cdot |\\vec{b}|}\\)" 
            },
           

            // --- Блок 5: Полезные значения тригонометрии для векторов ---
            { 
                question: "Чему равен \\(\\cos 60^\\circ\\)?", 
                answer: "\\(\\dfrac{1}{2}\\)" 
            },
            { 
                question: "Чему равен \\(\\cos 45^\\circ\\)?", 
                answer: "\\(\\dfrac{\\sqrt{2}}{2}\\)" 
            },
            { 
                question: "Чему равен \\(\\cos 90^\\circ\\)?", 
                answer: "\\(0\\)" 
            },
            { 
                question: "Чему равен \\(\\cos 30^\\circ\\)?", 
                answer: "\\(\\dfrac{\\sqrt{3}}{2}\\)" 
            },
            { 
                question: "Чему равен \\(\\cos 120^\\circ\\)?", 
                answer: "\\(-\\dfrac{1}{2}\\)" 
            },
            { 
                question: "Чему равен \\(\\cos 135^\\circ\\)?", 
                answer: "\\(-\\dfrac{\\sqrt{2}}{2}\\)" 
            }
        ];

        // ==== СОСТОЯНИЕ ====
        let deck = [];
        let totalCount = 0;
        let currentIndex = null;

        const cardEl = document.getElementById('flashcard');
        const questionEl = document.getElementById('card-question');
        const answerEl = document.getElementById('card-answer');
        const remainingEl = document.getElementById('fc-remaining');
        const totalEl = document.getElementById('fc-total');
        const sceneContainer = document.getElementById('fc-scene-container');
        const finishScreen = document.getElementById('finish-screen');

        // ==== ФУНКЦИИ ====

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function startDeck() {
            deck = shuffle(FLASHCARDS.map((_, i) => i));
            totalCount = deck.length;
            totalEl.textContent = totalCount;
            finishScreen.classList.remove('active');
            sceneContainer.style.display = 'block';
            document.getElementById('fc-header').style.display = 'flex';
            showNextCard();
        }

        function showNextCard() {
            cardEl.classList.remove('flipped', 'swipe-left', 'swipe-right');
            cardEl.style.animation = 'none';
            void cardEl.offsetWidth;
            cardEl.style.animation = '';

            if (deck.length === 0) {
                finishDeck();
                return;
            }

            currentIndex = deck[0];
            const card = FLASHCARDS[currentIndex];
            questionEl.innerHTML = card.question;
            answerEl.innerHTML = card.answer;

            remainingEl.textContent = deck.length;

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([questionEl, answerEl]).catch(err => console.log(err));
            }
        }

        function flipCard() {
            cardEl.classList.toggle('flipped');
        }

        function markCard(known) {
            if (!cardEl.classList.contains('flipped')) {
                cardEl.classList.add('flipped');
                return;
            }

            if (known) {
                cardEl.classList.add('swipe-right');
                setTimeout(() => {
                    deck.shift();
                    showNextCard();
                }, 500);
            } else {
                cardEl.classList.add('swipe-left');
                setTimeout(() => {
                    const first = deck.shift();
                    deck.push(first);
                    showNextCard();
                }, 500);
            }
        }

        function finishDeck() {
            sceneContainer.style.display = 'none';
            document.getElementById('fc-header').style.display = 'none';
            finishScreen.classList.add('active');
            document.getElementById('finish-text').textContent =
                `Ты прошёл все ${totalCount} карточек. Отличная работа!`;
        }

        function restartDeck() {
            startDeck();
        }

        document.addEventListener('DOMContentLoaded', () => {
            startDeck();
        });
    </script>

    <script>
        function logout() {
            localStorage.removeItem('sonches_user_role');
            localStorage.removeItem('sonches_user_email');
            localStorage.removeItem('sonches_user_name');
            window.location.href = 'login.html';
        }
    </script>
    <script src="cookies.js"></script>
</body>
</html>
