<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonches Math | Регистрация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,.08);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        #register-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #register-form input {
            padding: 15px;
            border: 2px solid #dceaff;
            border-radius: 15px;
            font-family: inherit;
            outline: none;
        }
        #register-form input:focus {
            border-color: #75aaff;
        }
        .btn-login {
            padding: 15px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            background-color: var(--color-blue);
            color: #fff;
            transition: 0.3s;
        }
        .btn-login:hover {
            background-color: #4a8cdb;
        }
        .btn-login:disabled {
            opacity: .6;
            cursor: not-allowed;
        }
        #error-msg {
            color: #e53935;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        #success-msg {
            color: #2ecc71;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        .link-box {
            margin-top: 20px;
            font-size: 14px;
        }
        .link-box a {
            color: var(--color-pink);
            text-decoration: none;
            font-weight: 700;
        }
                /* Стили для чекбокса согласия */
        .consent-label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            text-align: left;
            margin: 10px 0;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.4;
            color: #777;
        }

        .consent-label input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #dceaff;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: all 0.2s;
            margin-top: 2px; /* Небольшое выравнивание с текстом */
        }

        .consent-label input[type="checkbox"]:checked {
            background-color: var(--color-blue);
            border-color: var(--color-blue);
        }

        .consent-label input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 14px;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .consent-text a {
            color: var(--color-pink);
            text-decoration: none;
            font-weight: 700;
        }
        
        .consent-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="bg-blob bg-blob--blue"></div>
<div class="bg-blob bg-blob--pink"></div>

<div class="app-wrapper" style="justify-content:center;align-items:center;">
    <div class="login-card">
        <div class="mascot" style="margin-bottom:20px;">
            <img src="https://img.icons8.com/color/96/000000/robot-2.png" alt="Робот-помощник">
        </div>
        
        <h1 class="logo" style="font-size: 32px; margin-bottom: 10px;">Sonches<span>Math</span></h1>
        <p style="color:#777;margin-bottom:30px;">Создание аккаунта</p>

        <form id="register-form">
            <input type="text" id="name" placeholder="Ваше имя" required>
            <input type="email" id="email" placeholder="Ваша почта" required>
            <input type="password" id="password" placeholder="Придумайте пароль" required>
            
            <!-- НОВЫЙ БЛОК: Чекбокс согласия -->
            <label class="consent-label">
                <input type="checkbox" id="consent-checkbox" required>
                <span class="consent-text">
                    Я согласен с <a href="privacy.html" target="_blank">Политикой конфиденциальности</a> и даю согласие на обработку персональных данных.
                </span>
            </label>

            <button type="submit" class="btn-login" id="submit-btn" disabled>Зарегистрироваться</button>
        </form>

        <div id="error-msg"></div>
        <div id="success-msg"></div>

        <div class="link-box">
            Уже есть аккаунт? <a href="login.html">Войти</a>
        </div>
    </div>
</div>

<script>
'use strict';

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxedXeIVz4Q7dWSE0k49LUQD6d_VQgn1S8M_D6sACMePJwhGk7qoUCFfQUsHYfhqMZ_/exec';

const form = document.getElementById('register-form');
const submitBtn = document.getElementById('submit-btn');
const errorMsg = document.getElementById('error-msg');
const successMsg = document.getElementById('success-msg');
// Логика активации кнопки при согласии
const consentCheckbox = document.getElementById('consent-checkbox');
        
consentCheckbox.addEventListener('change', () => {
// Если галочка стоит — включаем кнопку, если нет — выключаем
    submitBtn.disabled = !consentCheckbox.checked;
});

form.addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    if (!name || !email || !password) {
        errorMsg.textContent = 'Заполните все поля.';
        errorMsg.style.display = 'block';
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Регистрация...';
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    const callbackName = 'sonchesCallback_' + Date.now();
    const params = new URLSearchParams();
    params.set('action', 'register'); // <-- ЭТА СТРОКА ДОЛЖНА БЫТЬ
    params.set('name', name);
    params.set('email', email);
    params.set('password', password);
    params.set('callback', callbackName);

    const script = document.createElement('script');
    script.async = true;
    let finished = false;

    function finish() {
        if (finished) return;
        finished = true;
        delete window[callbackName];
        script.remove();
        submitBtn.disabled = false;
        submitBtn.textContent = 'Зарегистрироваться';
    }

    window[callbackName] = function(data) {
        if (finished) return;
        finish();

        if (data.success) {
            successMsg.textContent = 'Успешно! Теперь вы можете войти.';
            successMsg.style.display = 'block';
            form.reset();
            // Через 2 секунды перекидываем на вход
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        } else {
            errorMsg.textContent = data.message || 'Ошибка регистрации.';
            errorMsg.style.display = 'block';
        }
    };

    script.onerror = function() {
        finish();
        errorMsg.textContent = 'Ошибка соединения. Проверьте интернет.';
        errorMsg.style.display = 'block';
    };

    script.src = SCRIPT_URL + '?' + params.toString();
    document.body.appendChild(script);
});
</script>

</body>
</html>
